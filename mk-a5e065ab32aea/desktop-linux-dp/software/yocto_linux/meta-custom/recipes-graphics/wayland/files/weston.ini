# Weston configuration for the Agilex 5 DisplayPort KMS driver (altera-vvp-dp).
#
# This SoC has no GPU.  Force the DRM backend with the Pixman (software)
# renderer so Weston composites in software and scans out through the
# altera-vvp-dp KMS device (dumb buffers + atomic page-flip).  Using the
# default GL/GBM renderer would fail to initialise (no EGL/GBM device).

[core]
# Software composition, no GPU.
renderer=pixman
# Keep the display on (no DPMS blank) for an always-on desktop demo.
idle-time=0
# Allow Weston to start on a seat with no input device present yet; a USB
# keyboard/mouse is hot-added by libinput when plugged in.  Without this,
# Weston aborts at startup with "failed to create input devices" /
# "fatal: failed to create compositor backend" on this headless board,
# leaving the DisplayPort output disabled (black screen).
require-input=false

[shell]
# Desktop look: top panel (taskbar) + Weston's built-in default background.
# With neither background-image nor background-color set, weston-desktop-shell
# draws its stock grey curve-tiled wallpaper.  Panel icons come from the stock
# weston package under /usr/share/weston.
panel-position=top
# NOTE: do NOT set clock-format=seconds.  HW-bisected on MK-A5E065AB32AEA: a
# per-second panel clock repaint re-commits the VFR plane every second
# (VFR_BUF_BASE+VFR_COMMIT), which knocks the DP video stream off and the sink
# loses signal (black screen).  The default minute-resolution clock repaints
# rarely enough that the DP link stays locked.

# Launcher icons on the panel give the desktop a taskbar appearance.  Both
# binaries are part of the weston package on this image.
[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/weston/icon_flower.png
path=/usr/bin/weston-flower

[output]
# The DisplayPort connector on this design.  Adjust the name if `modetest`
# reports a different connector (e.g. DP-2); 1920x1080@60 matches the driver's
# fixed mode.
name=DP-1
mode=1920x1080@60
