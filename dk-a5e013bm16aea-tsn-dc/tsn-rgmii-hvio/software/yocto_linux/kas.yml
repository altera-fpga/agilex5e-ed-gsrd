header:
  version: 17
  includes:
    - kas/machine.yml
    - kas/bsp.yml

repos:
  bitbake:
    url: https://github.com/openembedded/bitbake.git
    branch: "2.18"
    commit: 0ad6c1c34a5e07a5f8dd66ab248c1e7b37b69fa9
    layers:
      .: disabled
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    commit: 00c66f1d38a234f7738c2eb8fafa41b4f057a865
    layers:
      meta:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c
    layers:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    commit: 14282a02be9c74a1276a7cda7d6c89e054699a11
    layers:
      meta-oe:
      meta-python:
      meta-networking:
  meta-clang:
    url: https://github.com/kraj/meta-clang.git
    branch: wrynose
    commit: ef0d22f21910a0c30c967eeb17d8f209806e2d81
  meta-altera-fpga:
    url: https://github.com/altera-fpga/meta-altera-fpga.git
    tag: QPDS26.3_REL_BASELINE_PR
    layers:
      meta-altera-bsp:
      meta-altera-platform:
  meta-custom:
    path: meta-custom

local_conf_header:
  boot-source: |
    SSBL_BOOT_SOURCE ?= "mmc0"
    KERNEL_BOOTARGS_SD_MMC ?= ""

  device-tree: |
    CUSTOM_UBOOT_DEVICE_TREE = "0"
    CUSTOM_LINUX_DEVICE_TREE = "0"

  # RBF file should be placed in meta-custom/recipes-fpga/fpga-bitstream/files/
  fpga-bitstream: |
    FPGA_ENABLE_CORE_PGM ?= "1"
    FPGA_RBF_FILE ?= "tsn_rgmii_hvio_hps_debug.core.rbf"

  kernel-modules: |
    KERNEL_MODULE_PROBECONF = "cfg80211"
    module_conf_cfg80211 = "blacklist cfg80211"
