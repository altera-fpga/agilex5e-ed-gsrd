# DRM/KMS core and helpers required by the altera-vvp-dp out-of-tree module.
#
# The module implements a full DRM driver (CRTC / encoder / connector / plane)
# using the atomic helper framework and GEM DMA allocator. Without these
# symbols in the kernel the module will fail to link at load time.
CONFIG_DRM=m
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_GEM_DMA_HELPER=y
CONFIG_DRM_DISPLAY_HELPER=y
# DisplayPort helper library (drm_dp_helper): AUX + link-training helpers used
# by the native link-training path (native_lt=1) in altera_vvp_dp_link.c.
CONFIG_DRM_DISPLAY_DP_HELPER=y
CONFIG_DRM_FBDEV_EMULATION=y
