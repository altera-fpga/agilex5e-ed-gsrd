# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta_custom"
BBFILE_PATTERN_meta_custom = "^${LAYERDIR}/"
LAYERDIR_meta_custom := "${LAYERDIR}"
export LAYERDIR_meta_custom


BBFILE_PRIORITY_meta_custom = "6"

LAYERDEPENDS_meta_custom = "core"
LAYERSERIES_COMPAT_meta_custom = "wrynose"

CUSTOM_UBOOT_DT = "${CUSTOM_UBOOT_DEVICE_TREE}"
CUSTOM_LINUX_DT = "${CUSTOM_LINUX_DEVICE_TREE}"

FPGA_CORE_PGM_ENABLE = "${FPGA_ENABLE_CORE_PGM}"

SSBL_BOOT_SRC = "${SSBL_BOOT_SOURCE}"

KERNEL_BOOTARGS = "${@ ' '.join([d.getVar('KERNEL_BOOTARGS_SD_MMC') if d.getVar('SSBL_BOOT_SRC') == 'mmc0' \
    else d.getVar('KERNEL_BOOTARGS_QSPI') if d.getVar('SSBL_BOOT_SRC') == 'qspi' else ''])}"

GSRD_APP_SYSCHK ??= "true"
SYSCHK_APP = "${GSRD_APP_SYSCHK}"
GSRD_APP_LED_CTRL ??= "true"
LED_CTRL_APP = "${GSRD_APP_LED_CTRL}"
GSRD_APP_GPIO_INT_TEST ??= "true"
GPIO_INT_TEST = "${GSRD_APP_GPIO_INT_TEST}"
GSRD_APP_HELLO_WORLD ??= "true"	
HELLO_WORLD_APP = "${GSRD_APP_HELLO_WORLD}"

IMAGE_INSTALL:append = "${@bb.utils.contains('GPIO_INT_TEST', 'true', ' pio-interrupt', '', d)}"
IMAGE_INSTALL:append = "${@bb.utils.contains('HELLO_WORLD_APP', 'true', ' hello', '', d)}"
IMAGE_INSTALL:append = " rootfs-files"
IMAGE_INSTALL:append = "${@'' if d.getVar('SSBL_BOOT_SOURCE') == 'qspi' else ' test-suite-agilex5'}"

# Add variables for wic creation of sdcard image
IMAGE_BOOT_FILES = " \
		uboot.env \
		boot.scr.uimg \
		u-boot.itb \
		kernel.itb \
		"

# Agilex5 U-Boot test suite (loadable from the boot partition).
# The per-file enumeration needs a python "def", which is only valid in a
# BBHandler-parsed file (a class), not in this ConfHandler-parsed layer.conf.
# The helper and IMAGE_BOOT_FILES wiring therefore live in
# classes/uboot-test-suite.bbclass, inherited by image recipes via IMAGE_CLASSES.
UBOOT_TEST_SUITE_ARCHIVE ?= "${LAYERDIR_meta_custom}/recipes-files/uboot-test-suite-agilex5/files/uboot-test-suite-agilex5.tar.gz"
IMAGE_CLASSES += "uboot-test-suite"
